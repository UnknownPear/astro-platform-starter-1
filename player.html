<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview M3U8 - Cococut Clone</title>
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
    }
    video {
      width: 100%;
      max-height: 70vh;
      background-color: black;
      border: 1px solid #333;
      margin-top: 10px;
    }
    .info {
      font-size: 14px;
      margin-top: 10px;
      color: #ccc;
      word-break: break-all;
    }
    a {
      color: #66c3ff;
    }
  </style>
</head>
<body>
  <h2>Visualização do .m3u8</h2>
  <video id="video" controls autoplay muted></video>
  <div class="info" id="info">Carregando URL...</div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const video = document.getElementById('video');
    const info = document.getElementById('info');
    const m3u8 = new URLSearchParams(window.location.search).get('m3u8');

    if (!m3u8) {
      info.textContent = 'Nenhuma URL m3u8 foi fornecida.';
    } else {
      info.innerHTML = `
        <strong>Link:</strong> <a href="${m3u8}" target="_blank">${m3u8}</a><br/>
        <strong>Expira:</strong> ${formatExpiration(m3u8)}
      `;

      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(m3u8);
        hls.attachMedia(video);
        hls.on(Hls.Events.ERROR, function (event, data) {
          console.error('HLS.js error:', data);
          info.innerHTML += `<br/><span style="color:red;">Erro: ${data.details}</span>`;
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = m3u8;
      } else {
        info.textContent = 'Seu navegador não suporta HLS.';
      }
    }

    function formatExpiration(url) {
      const match = url.match(/exp=(\d+)/);
      if (!match) return 'não detectada';
      const ts = parseInt(match[1]);
      const date = new Date(ts * 1000);
      const diff = Math.floor((ts - Date.now() / 1000));
      const mins = Math.floor(diff / 60);
      const secs = diff % 60;
      return `${date.toLocaleString()} (${mins}min ${secs}s restantes)`;
    }
  </script>
</body>
</html>
